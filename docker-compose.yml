# Jalankan seluruh stack:  docker compose up -d --build
# Dengan HTTPS + domain:   DOMAIN=bku.contoh.go.id docker compose --profile https up -d --build
# Isi data contoh:        docker compose exec app node src/db/seed.js   (jangan di server produksi)
# Panduan lengkap:        docs/DEPLOY.md
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bku
      POSTGRES_USER: bku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bku}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB", "-c", "wal_level=replica"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bku -d bku"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 8760
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://bku:${POSTGRES_PASSWORD:-bku}@postgres:5432/bku
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-ganti-dengan-rahasia-panjang}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["monitoring"]
    environment:
      KAFKA_CLUSTERS_0_NAME: bku
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"
    depends_on: [kafka]

volumes:
  pgdata:
  kafkadata:
  caddydata:
