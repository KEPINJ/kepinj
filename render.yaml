# Blueprint Render (https://render.com): Dashboard > New > Blueprint > pilih repo ini.
# Membuat layanan web (Docker) + PostgreSQL terkelola. Kafka tidak tersedia di Render,
# aplikasi otomatis memakai bus event internal (realtime tetap jalan).
services:
  - type: web
    name: bku-bkad
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bku-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: bku-db
    databaseName: bku
    user: bku
    plan: basic-256mb
    region: singapore
